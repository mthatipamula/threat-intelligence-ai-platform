name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_DB: tip, POSTGRES_USER: tip, POSTGRES_PASSWORD: ci-only }
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U tip -d tip" --health-interval 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://tip:ci-only@localhost:5433/tip
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest -v
