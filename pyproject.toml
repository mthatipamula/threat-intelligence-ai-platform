[project]
name = "threat-intelligence-ai-platform"
version = "0.1.0"
description = "AI-assisted threat intelligence for a crypto exchange: OSINT collection, STIX 2.1 store, investigations, detections and briefs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "stix2>=3.0.1",
    "psycopg[binary]>=3.2",
    "httpx>=0.28",
    "duckdb>=1.3",
    "typer>=0.16",
    "rich>=14.0",
    "pydantic-settings>=2.9",
    "dnspython>=2.7",
]

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["db: needs the Postgres from compose.yaml (skipped when it isn't running)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.uv]
# Install only the dependencies; the code runs from src/ (./tip and pytest put it on the path). On an iCloud-synced
# Desktop, macOS flags everything in .venv as hidden, and Python skips hidden .pth files, which breaks editable installs.
package = false
