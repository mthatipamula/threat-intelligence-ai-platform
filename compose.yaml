# Local stack. Postgres holds the STIX 2.1 store (and, from step 2, pgvector embeddings for RAG).
# Synthetic internal logs live in DuckDB (data/logs.duckdb), standing in for the SIEM.
name: threat-intel

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: tip
      POSTGRES_USER: tip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./scripts/init-env.sh}
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tip -d tip"]
      interval: 3s
      retries: 30

  # ---------------------------------------------------------------- optional: MISP threat-sharing platform
  # docker compose --profile misp up -d   (first start takes a few minutes; UI at https://localhost:8443)
  # Mirrors the official misp-docker layout: misp (PHP-FPM application) behind misp-nginx (HTTPS, self-signed).
  misp-db:
    profiles: [misp]
    image: mariadb:10.11
    environment:
      MYSQL_DATABASE: misp
      MYSQL_USER: misp
      MYSQL_PASSWORD: ${MISP_DB_PASSWORD:-}
      MYSQL_ROOT_PASSWORD: ${MISP_DB_ROOT_PASSWORD:-}
    volumes: ["misp-db:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin --user=misp --password=$$MYSQL_PASSWORD status"]
      interval: 5s
      retries: 60

  misp-redis:
    profiles: [misp]
    image: valkey/valkey:7.2
    command: ["valkey-server", "--requirepass", "${MISP_REDIS_PASSWORD:-}"]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      retries: 30
    environment:
      REDIS_PASSWORD: ${MISP_REDIS_PASSWORD:-}

  misp:
    profiles: [misp]
    image: ghcr.io/misp/misp-docker/misp-core:latest
    depends_on:
      misp-db: {condition: service_healthy}
      misp-redis: {condition: service_healthy}
    environment:
      BASE_URL: https://localhost:8443
      ADMIN_EMAIL: ${MISP_ADMIN_EMAIL:-admin@meridianx.test}
      ADMIN_PASSWORD: ${MISP_ADMIN_PASSWORD:-}
      ADMIN_KEY: ${MISP_ADMIN_KEY:-}
      ADMIN_ORG: Meridian Exchange
      MYSQL_HOST: misp-db
      MYSQL_USER: misp
      MYSQL_PASSWORD: ${MISP_DB_PASSWORD:-}
      MYSQL_DATABASE: misp
      REDIS_HOST: misp-redis
      REDIS_PASSWORD: ${MISP_REDIS_PASSWORD:-}
      DISABLE_IPV6: "true"
      FASTCGI_LISTEN_STATUS: misp:9003
    volumes:
      - misp-configs:/var/www/MISP/app/Config
      - misp-files:/var/www/MISP/app/files
    healthcheck:  # the application is PHP-FPM on 9002; misp-nginx serves HTTP
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9002' || exit 1"]
      interval: 10s
      retries: 90

  misp-nginx:
    profiles: [misp]
    image: ghcr.io/misp/misp-docker/misp-nginx:latest
    depends_on:
      misp: {condition: service_healthy}
    environment:
      BASE_URL: https://localhost:8443
      DISABLE_IPV6: "true"
      FASTCGI_LISTEN: misp:9002
      FASTCGI_LISTEN_STATUS: misp:9003
    volumes: ["./data/misp-ssl:/etc/nginx/certs:ro"]  # created by ./scripts/init-env.sh
    ports: ["127.0.0.1:8443:8443"]

volumes:
  pgdata:
  misp-db:
  misp-configs:
  misp-files:
