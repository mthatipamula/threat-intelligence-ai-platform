title: Non-browser process reads browser cookies or wallet extension data
id: 3f2b7c1e-8a4d-4f0b-9c61-2d7e5a9b1003
status: experimental
description: >-
  Something other than the browser reads Chrome's cookie database or a crypto-wallet extension's storage. Stolen
  session cookies let attackers skip passwords and MFA; wallet extension data can expose keys.
author: threat-intelligence-ai-platform (draft)
date: 2026-10-25
tags: [attack.credential-access, attack.t1555.003, attack.t1539]
logsource: {category: file_access, product: macos}
detection:
  selection_cookies:
    TargetFilename|endswith: '/Cookies'
  selection_wallets:
    TargetFilename|contains: '/Local Extension Settings/'
  filter_browser:
    Image|endswith: ['Google Chrome', 'Google Chrome Helper']
  condition: 1 of selection_* and not filter_browser
falsepositives:
  - Backup and endpoint-security software scanning the profile folder
level: critical
