title: A person reads a production secret
id: 3f2b7c1e-8a4d-4f0b-9c61-2d7e5a9b1007
status: experimental
description: >-
  A human (federated) account, rather than a service role, reads a production secret. Production secrets such as the
  hot-wallet withdrawal key should only be read by the services that use them.
author: threat-intelligence-ai-platform (draft)
date: 2026-10-25
tags: [attack.credential-access, attack.t1555.006]
logsource: {product: meridian, service: cloud_audit}
detection:
  selection:
    action: 'secretsmanager:GetSecretValue'
    principal_type: federated-user
    resource|contains: ':secret:prod/'
  condition: selection
falsepositives:
  - Break-glass access during an incident; require a ticket reference
level: critical
